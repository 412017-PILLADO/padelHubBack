# Perfil de tests de integración (@ActiveProfiles("test")). Sólo overrides; el resto se hereda de
# application.yml. Todas las clases IT comparten una sola DB (singleton container), así que los
# límites anti-abuso se suben para que las reservas de un test no afecten a las de otro (misma IP).
padel:
  antiabuse:
    max-turnos-por-telefono: 1000
    ip:
      max-por-ventana: 1000
      ventana: PT1H
    publico:
      max-por-ventana: 100000
      ventana: PT1H
  crypto:
    key: 8yUu8vJp2m4H0aXbW1cQzTt3nRr5sVv7kLl9pDdGgFf=   # key fija de test
  mercadopago:
    # Credenciales fake: habilitan el módulo (configurado() == true) para los IT del flujo OAuth.
    # Nunca se usan contra MP real: el gateway está stubbeado en los tests (StubMpConfig).
    client-id: test-client-id
    client-secret: test-client-secret
